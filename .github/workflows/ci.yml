name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  quality:
    name: Quality checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "latest"

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Run linter
        run: uv run --extra dev ruff check .

      - name: Check formatting
        run: uv run --extra dev ruff format --check .

      - name: Run type checker
        run: uv run --extra dev ty check

      - name: Build docs
        run: uv run --extra dev mkdocs build --strict

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "latest"

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Install Qt platform plugins (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
            x11-utils

      - name: Run tests (Linux — xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --extra dev pytest
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: uv run --extra dev pytest
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Upload coverage HTML
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: htmlcov/
          if-no-files-found: ignore
