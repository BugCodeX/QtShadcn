name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  quality:
    name: Quality checks (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Run linter
        run: uv run --extra dev ruff check .

      - name: Check formatting
        run: uv run --extra dev ruff format --check .

      - name: Run type checker
        run: uv run --extra dev ty check

      - name: Build docs
        run: uv run --extra dev mkdocs build --strict

  tests:
    name: Tests with PySide6 (${{ matrix.os }}, Python ${{ matrix.python-version }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Install Qt platform plugins (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
            x11-utils

      - name: Run tests (Linux — xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --extra dev pytest
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: uv run --extra dev pytest
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Upload coverage HTML
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: htmlcov/
          if-no-files-found: ignore

  binding-matrix:
    name: Tests with ${{ matrix.binding }} (${{ matrix.os }}, Python ${{ matrix.python-version }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
        binding: [pyside6, pyqt6]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            binding: pyside2
          - os: ubuntu-latest
            python-version: "3.12"
            binding: pyqt5
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and ${{ matrix.binding }} test dependencies
        run: |
          uv venv
          uv pip install -e .
          uv pip install ${{ matrix.binding }} pytest pytest-qt pytest-mock

      - name: Install Qt platform plugins (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
            x11-utils

      - name: Run tests with ${{ matrix.binding }}
        run: uv run pytest
        env:
          QT_QPA_PLATFORM: offscreen
          QT_API: ${{ matrix.binding }}

  no-binding:
    name: No-binding error path
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"

      - name: Install package without Qt binding
        run: |
          uv venv
          uv pip install -e .

      - name: Assert QtBindingError without binding
        run: |
          uv run python - <<'PY'
          try:
              import qtshadcn  # noqa: F401
          except ImportError as exc:
              if "No supported Qt binding found" not in str(exc):
                  raise
              print("OK: QtBindingError raised:", exc)
          else:
              raise SystemExit("Expected QtBindingError when no binding is installed")
          PY
