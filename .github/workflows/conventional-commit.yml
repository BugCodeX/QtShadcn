name: Conventional Commits

on:
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  check:
    name: Validate commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate conventional commits
        shell: bash
        run: |
          set -euo pipefail

          # Regex for conventional commits:
          # type[!][(scope)]: description
          # types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(!)?(\([a-zA-Z0-9._-]+\))?: .+'

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          echo "Checking commits from ${base:0:8} to ${head:0:8}..."

          invalid=0
          while IFS= read -r line; do
            hash="${line%% *}"
            subject="${line#* }"
            if [[ "$subject" =~ $pattern ]]; then
              echo "  ✓ ${hash:0:8} $subject"
            else
              echo "  ✗ ${hash:0:8} $subject"
              invalid=$((invalid + 1))
            fi
          done < <(git log --no-merges --format='%H %s' "$base..$head")

          if [ "$invalid" -gt 0 ]; then
            echo
            echo "ERROR: $invalid commit(s) do not follow Conventional Commits."
            echo "Expected format: <type>[!][(scope)]: <description>"
            echo "Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi

          echo
          echo "All commits follow Conventional Commits."
