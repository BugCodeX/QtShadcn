name: Set up Python and uv
description: Install a specific Python version and the uv package manager.

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.11"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
