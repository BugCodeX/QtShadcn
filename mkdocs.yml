site_name: QtShadcn
site_description: Modern styling and theming framework for Qt/PySide and PyQt applications, inspired by shadcn/ui.
site_url: https://qtshadcn.readthedocs.io/

repo_name: BugCodeX/QtShadcn
repo_url: https://github.com/BugCodeX/QtShadcn

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Theme Format: theme-format.md
  - API Reference: api-reference.md
  - Roadmap: roadmap.md

docs_dir: docs

theme:
  name: material
  features:
    - content.code.copy
    - navigation.top
    - navigation.footer
  logo: source/logo.png
  favicon: source/logo.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.blocks.tab:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.magiclink
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.blocks.admonition
  - toc:
      permalink: true
