# .readthedocs.yaml
# Read the Docs configuration file for QtShadcn
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  jobs:
    post_install:
      - pip install uv
      - uv pip install mkdocs-material pymdown-extensions

mkdocs:
  configuration: mkdocs.yml
